name: build

# Na svaki push na main: testovi → Docker image (linux/amd64, za mordor) → GHCR
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Dashboard JSON je u skladu s generatorom
        run: |
          npm run dashboard
          git diff --exit-code grafana/dashboards/ || (echo "::error::Pokreni 'npm run dashboard' i commitaj JSON" && exit 1)

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ime imagea (GHCR traži mala slova)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/garmin-sync" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitOps: upiše novi tag u apps-config (apps/garmin-sync/envs/dev), a Argo CD ga deploya na DEV.
  # Pristup apps-configu: GitHub App (varijabla CONFIG_APP_CLIENT_ID + secret CONFIG_APP_PRIVATE_KEY).
  # Dok varijabla ne postoji, job se preskače.
  update-dev:
    name: Novi tag na DEV (apps-config)
    needs: image
    if: github.ref == 'refs/heads/main' && vars.CONFIG_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: apps-config-garmin-sync-dev
      cancel-in-progress: false
    steps:
      - name: Token za apps-config (GitHub App, vrijedi 1 h)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CONFIG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONFIG_APP_PRIVATE_KEY }}
          owner: simebarisic
          repositories: apps-config

      - name: Checkout apps-config
        uses: actions/checkout@v7
        with:
          repository: simebarisic/apps-config
          token: ${{ steps.app-token.outputs.token }}

      - name: Upiši tag i pushaj
        run: |
          TAG="${GITHUB_SHA}"   # isti tag koji je build objavio na GHCR
          ./scripts/set-tag.sh garmin-sync dev "$TAG"
          if git diff --quiet; then echo "DEV je već na $TAG"; exit 0; fi
          git config user.name "garmin-sync-ci"
          git config user.email "garmin-sync-ci@users.noreply.github.com"
          git commit -qam "garmin-sync: DEV -> $TAG ($GITHUB_SHA)"
          # Ako je netko u međuvremenu pushao u apps-config, povuci i pokušaj ponovno.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
