apiVersion: 1

datasources:
  - name: Garmin
    uid: garmin-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: garmin_reader
    isDefault: true
    editable: false
    jsonData:
      database: garmin
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
