name: build

# Na svaki push na main: testovi → Docker image (linux/amd64, za mordor) → GHCR
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Dashboard JSON je u skladu s generatorom
        run: |
          npm run dashboard
          git diff --exit-code grafana/dashboards/ || (echo "::error::Pokreni 'npm run dashboard' i commitaj JSON" && exit 1)

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ime imagea (GHCR traži mala slova)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/garmin-sync" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
